<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 唤醒任务</title>
<style>
  :root { color-scheme: dark; font: 16px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif; background: #121c2b; color: #edf3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 40px, 840px); margin: clamp(32px, 8vh, 80px) auto; }
  h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.3; margin: 0 0 24px; }
  dl { margin: 0; padding: 8px 24px; background: #1d293c; border: 1px solid #35475e; border-radius: 16px; }
  dl div { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding: 16px 0; }
  dl div + div { border-top: 1px solid #35475e; }
  dt { color: #bcc9db; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .version { color: #88daff; font-weight: 650; }
</style>
<main>
  <h1>Codex 唤醒任务</h1>
  <dl>
    <div><dt>插件版本</dt><dd class="version">v{{VERSION}}</dd></div>
    <div><dt>插件标识</dt><dd>cpa-codex-wakeup</dd></div>
    <div><dt>作者</dt><dd>bitterswe</dd></div>
  </dl>
</main>
</html>
