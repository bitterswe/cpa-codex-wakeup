<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 唤醒任务</title>
<style>
:root{color-scheme:dark;font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;background:#151c29;color:#e9f1ff}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:32px 20px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,36px)}h2{font-size:21px}h3{font-size:16px}small,.muted{color:#a4b4ca}.row,header,footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header,footer,.spread{justify-content:space-between}
section,article,dialog{background:#1d293b;border:1px solid #35465e;border-radius:16px}section,article{padding:18px;margin-top:16px}article{background:#202e43}button,input,select,textarea{font:inherit;color:inherit;background:#243349;border:1px solid #445671;border-radius:10px;padding:9px 13px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#76b9ff}button:disabled{opacity:.45;cursor:default}.primary,button[aria-pressed=true]{background:linear-gradient(115deg,#2453c9,#0a8095);border-color:#386dbd;color:#fff}input,select,textarea{min-width:0}input:not([type=checkbox]),select,textarea{max-width:100%}input[type=checkbox]{accent-color:#4bafff}.wide{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px}.field{display:grid;gap:7px;margin:14px 0;font-weight:600}.field>input,.field>select,.field>textarea{width:100%;font-weight:400}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:650;margin-bottom:8px}dialog{color:inherit;width:min(860px,96vw);max-height:92vh;padding:0;box-shadow:0 20px 90px #0007}dialog::backdrop{background:#060c16b8}dialog header,dialog footer{background:#202c40;padding:15px 22px}dialog header{border-bottom:1px solid #35465e}dialog footer{justify-content:flex-end;border-top:1px solid #35465e;position:sticky;bottom:0}.inner{padding:8px 22px 22px}.account{text-align:left;overflow-wrap:anywhere;display:grid;gap:4px}.account strong{font-size:14px}.account small{font-size:12px}.note{color:#95d7ff}.err{color:#ffaaa8;white-space:pre-wrap}#notice{position:sticky;top:4px;z-index:2;background:#312a35;border-radius:8px;padding:6px 12px}#notice:empty{display:none}hr{border:0;border-top:1px solid #35465e;margin:16px 0}.hidden,[hidden]{display:none!important}.scroll{max-height:42vh;overflow:auto}.badge{border:1px solid #42678b;padding:2px 8px;border-radius:20px;font-size:12px}.chosen{outline:2px solid #538dd3}.stack{display:grid;gap:8px}details{margin:6px 0}time{font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#182333;padding:10px 14px;border-radius:8px}details h4{margin:12px 0 4px}
</style>
<main><header><div><h1>Codex 唤醒任务</h1><small>v{{VERSION}}</small></div><div class="row" id="toolbar" hidden><button id="pool">账号池与标签</button><button id="models">模型预设</button><button class="primary" id="create">新建任务</button></div></header>
<p class="err" id="notice" role="alert"></p>
<section id="login"><h2>连接 CPA 管理接口</h2><form id="connect" class="row"><label class="field">CPA 管理密钥<input id="key" type="password" autocomplete="off" required></label><button class="primary">连接</button></form><small>密钥仅保存在本页内存中，刷新后可重新连接。</small></section>
<div id="dashboard" hidden><section><header><h2>唤醒任务</h2><small id="count"></small></header><div id="tasks"></div></section><section><h2>执行记录与待确认任务</h2><div id="runs"></div></section></div>
</main>
<dialog id="editor"><header><h2 id="title"></h2><button aria-label="关闭" data-close>×</button></header><div class="inner" id="fields"></div><footer><span id="error" class="err" role="alert"></span><button data-close>取消</button><button id="save" class="primary">保存</button></footer></dialog>
<script>/*PLUGIN_UI*/</script></html>
