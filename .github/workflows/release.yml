name: Verify and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native plugin for Debian Bookworm
        run: |
          mkdir build
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GOCACHE=/tmp/go-cache -e GOPATH=/tmp/go -e CGO_ENABLED=1 \
            -v "$PWD:/src" -w /src golang:1.26-bookworm \
            sh -c 'go test -buildvcs=false . && go build -trimpath -buildvcs=false -buildmode=c-shared -o build/cpa-codex-wakeup.so .'
      - name: Exercise native ABI and package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(python3 tests/smoke.py build/cpa-codex-wakeup.so)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          cd build
          zip -j "cpa-codex-wakeup_${version}_linux_${ARCH}.zip" cpa-codex-wakeup.so
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: build/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" *.zip checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
